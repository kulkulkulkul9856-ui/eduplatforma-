<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>INITIALIZING</title>
<script>
window.errors = [];
window.onerror = function(msg, url, line, col, error) {
    window.errors.push(msg + ' at line ' + line);
    document.title = 'ERROR: ' + msg + ' at line ' + line;
    var el = document.createElement('div');
    el.id = 'error-box';
    el.innerText = 'ERROR: ' + msg + ' at line ' + line;
    document.body.appendChild(el);
};
</script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/catalog.js"></script>
<script src="js/cart.js"></script>
<script src="js/ai-chat.js"></script>
<script>
window.addEventListener('DOMContentLoaded', function() {
    setTimeout(function() {
        if (window.errors.length === 0 && typeof products !== 'undefined') {
            document.title = 'SUCCESS: ' + products.length + ' products, ' + categories.length + ' categories loaded!';
            var el = document.createElement('div');
            el.id = 'success-box';
            el.innerText = 'SUCCESS: ' + products.length + ' products, ' + categories.length + ' categories loaded!';
            document.body.appendChild(el);
        }
    }, 100);
});
</script>
</head>
<body>
<h1>Test Runner</h1>
</body>
</html>
